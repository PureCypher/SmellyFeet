services:
  smellyfeet:
    build:
      context: ..
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
    ports:
      - "3000:3000"           # keep LAN access at http://192.168.1.135:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}   # read by cloudflared; kept out of argv so it never shows in ps
    command: tunnel --no-autoupdate run
    # Host networking: the dashboard ingress targets http://127.0.0.1:3000, which on a
    # bridge network is cloudflared itself (connection refused -> 502). On the host netns
    # it reaches the published port; the alias keeps the documented smellyfeet:3000 working.
    network_mode: host
    extra_hosts:
      - "smellyfeet:127.0.0.1"
    depends_on:
      - smellyfeet
