{{ define "stats" }}{{ template "header" . }}
<div class="mb-7">
  <p class="font-mono text-[11px] uppercase tracking-[0.25em] text-accent/80 mb-1.5">// system</p>
  <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">Statistics</h1>
</div>
{{ with .Stats }}
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <div class="bg-ink-900 border border-line rounded-xl p-6 hover:border-accent/40 transition-colors">
    <div class="font-mono text-[10px] uppercase tracking-widest text-fog">Total articles</div>
    <div class="font-mono text-4xl font-semibold text-accent mt-2 tabular-nums">{{ .TotalArticles }}</div>
  </div>
  <div class="bg-ink-900 border border-line rounded-xl p-6 hover:border-accent/40 transition-colors">
    <div class="font-mono text-[10px] uppercase tracking-widest text-fog">Sources</div>
    <div class="font-mono text-4xl font-semibold text-zinc-100 mt-2 tabular-nums">{{ .TotalFeeds }}</div>
  </div>
  <div class="bg-ink-900 border border-line rounded-xl p-6 hover:border-accent/40 transition-colors">
    <div class="font-mono text-[10px] uppercase tracking-widest text-fog">Last fetch</div>
    <div class="font-mono text-lg font-medium text-zinc-100 mt-3">{{ if .LastFetch }}{{ .LastFetch | formatDate }}{{ else }}—{{ end }}</div>
  </div>
</div>
{{ end }}
{{ template "footer" . }}{{ end }}
